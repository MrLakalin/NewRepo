{% extends "base.html" %}
{% block title %}Редактирование администратора{% endblock %}

{% block content %}
<div class="container section">
    <h1 class="section__title">Администратор: {{ admin.phone }}</h1>

    <form method="POST"
          action="{{ url_for('admin_admin_edit', admin_id=admin.id) }}"
          class="form-card" novalidate>
        <div class="form-group">
            <label>Телефон</label>
            <input type="text" class="form-input"
                   value="{{ admin.phone }}" disabled>
        </div>

        <div class="form-group">
            <label for="full_name">
                ФИО <span class="required">*</span>
            </label>
            <input type="text" id="full_name" name="full_name"
                   class="form-input" required value="{{ admin.full_name }}">
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" name="reset_password" value="1"
                       onchange="document.getElementById('new_password').disabled = !this.checked;">
                Сбросить пароль
            </label>
            <input type="text" id="new_password" name="new_password"
                   class="form-input" minlength="6" disabled
                   placeholder="Новый пароль (мин. 6 символов)"
                   style="margin-top:8px;">
        </div>

        <div class="form-actions">
            <a href="{{ url_for('admin_admins') }}" class="btn btn--secondary">
                Отмена
            </a>
            <button type="submit" class="btn">Сохранить</button>
        </div>
    </form>
</div>
{% endblock %}
