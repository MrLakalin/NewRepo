{% extends "base.html" %}
{% block title %}Новый администратор{% endblock %}

{% block content %}
<div class="container section">
    <h1 class="section__title">Добавление администратора</h1>

    <form method="POST" action="{{ url_for('admin_admin_new') }}"
          class="form-card" novalidate>
        <div class="form-group">
            <label for="full_name">ФИО</label>
            <input type="text" id="full_name" name="full_name"
                   class="form-input"
                   placeholder="Если пусто — будет «Администратор»"
                   value="{{ form_data.get('full_name', '') }}">
        </div>

        <div class="form-group">
            <label for="phone">
                Номер телефона <span class="required">*</span>
            </label>
            <input type="tel" id="phone" name="phone"
                   class="form-input" required
                   value="{{ form_data.get('phone', '') }}">
        </div>

        <div class="form-group">
            <label for="password">
                Пароль <span class="required">*</span>
            </label>
            <input type="text" id="password" name="password"
                   class="form-input" required minlength="6"
                   placeholder="Минимум 6 символов">
        </div>

        <div class="form-actions">
            <a href="{{ url_for('admin_admins') }}" class="btn btn--secondary">
                Отмена
            </a>
            <button type="submit" class="btn">Сохранить</button>
        </div>
    </form>
</div>
{% endblock %}
