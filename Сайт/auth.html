<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация - Городская Библиотека</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
    <div class="container header__container">
        <a href="index.html" class="logo">Городская<span>Библиотека</span></a>
        <nav class="nav">
            <a href="index.html" class="nav__link ">Главная</a>
            <a href="catalog.html" class="nav__link ">Каталог</a>
            <a href="cabinet.html" class="nav__link ">Личный кабинет</a>
            <a href="auth.html" class="btn btn--secondary">Войти</a>
        </nav>
    </div>
</header>

    <main class="container section flex-center">
        <div class="auth-container">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('login')">Вход</button>
                <button class="tab-btn" onclick="switchTab('register')">Регистрация</button>
            </div>

            <!-- Login Form -->
            <div id="login-form" class="auth-form active">
                <h2>Войти в аккаунт</h2>
                <form action="cabinet.html" method="GET">
                    <div class="form-group">
                        <label>Электронная почта / Номер билета</label>
                        <input type="text" class="form-input" required placeholder="example@mail.ru">
                    </div>
                    <div class="form-group">
                        <label>Пароль</label>
                        <input type="password" class="form-input" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn" style="width: 100%;">Войти</button>
                </form>
            </div>

            <!-- Register Form -->
            <div id="register-form" class="auth-form">
                <h2>Создать профиль читателя</h2>
                <form action="cabinet.html" method="GET">
                    <div class="form-group">
                        <label>Полное имя (ФИО)</label>
                        <input type="text" class="form-input" required placeholder="Иванов Иван Иванович">
                    </div>
                    <div class="form-group">
                        <label>Электронная почта</label>
                        <input type="email" class="form-input" required placeholder="example@mail.ru">
                    </div>
                    <div class="form-group">
                        <label>Пароль</label>
                        <input type="password" class="form-input" required placeholder="Придумайте пароль">
                    </div>
                    <button type="submit" class="btn" style="width: 100%;">Зарегистрироваться</button>
                </form>
            </div>
        </div>
    </main>

    <script>
        function switchTab(type) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const buttons = document.querySelectorAll('.tab-btn');

            if (type === 'login') {
                loginForm.classList.add('active');
                registerForm.classList.remove('active');
                buttons[0].classList.add('active');
                buttons[1].classList.remove('active');
            } else {
                loginForm.classList.remove('active');
                registerForm.classList.add('active');
                buttons[0].classList.remove('active');
                buttons[1].classList.add('active');
            }
        }
    </script>
</body>
</html>
