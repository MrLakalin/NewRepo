<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход и Регистрация — ГородскаяБиблиотека</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container header__container">
            <a href="index.html" class="logo">Городская<span>Библиотека</span></a>
            <nav class="nav">
                <a href="index.html" class="nav__link">Главная</a>
                <a href="catalog.html" class="nav__link">Каталог</a>
                <a href="cabinet.html" class="nav__link">Кабинет</a>
            </nav>
        </div>
    </header>

    <main class="container section flex-center">
        <div class="auth-container">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('login')">Вход</button>
                <button class="tab-btn" onclick="switchTab('register')">Регистрация</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form active" action="cabinet.html">
                <h2>Войти в кабинет</h2>
                <div class="form-group">
                    <label>Номер читательского билета или Email</label>
                    <input type="text" class="form-input" required placeholder="123456">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" class="form-input" required placeholder="******">
                </div>
                <button type="submit" class="btn" style="width: 100%;">Войти</button>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="auth-form" action="cabinet.html">
                <h2>Регистрация читателя</h2>
                <div class="form-group">
                    <label>ФИО</label>
                    <input type="text" class="form-input" required placeholder="Иванов Иван Иванович">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-input" required placeholder="ivanov@example.com">
                </div>
                <div class="form-group">
                    <label>Придумайте пароль</label>
                    <input type="password" class="form-input" required minlength="6">
                </div>
                <button type="submit" class="btn" style="width: 100%;">Зарегистрироваться</button>
            </form>
        </div>
    </main>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
            
            if (tab === 'login') {
                document.getElementById('login-form').classList.add('active');
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
            } else {
                document.getElementById('register-form').classList.add('active');
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
            }
        }
    </script>
</body>
</html>
