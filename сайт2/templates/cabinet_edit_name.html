{% extends "base.html" %}
{% block title %}Изменение имени{% endblock %}

{% block content %}
<div class="container section flex-center">
    <div class="auth-container">
        <form method="POST" action="{{ url_for('cabinet_edit_name') }}"
              class="auth-form active" novalidate>
            <h2>Изменение имени</h2>

            <div class="form-group">
                <label>Телефон</label>
                <input type="text" class="form-input"
                       value="{{ current_user.phone }}" disabled>
            </div>

            <div class="form-group">
                <label for="full_name">
                    ФИО <span class="required">*</span>
                </label>
                <input type="text" id="full_name" name="full_name"
                       class="form-input" required minlength="3"
                       value="{{ current_user.full_name }}"
                       placeholder="Иванов Иван Иванович">
            </div>

            <button type="submit" class="btn" style="width:100%;">
                Сохранить
            </button>

            <p class="auth-switch">
                <a href="{{ url_for('cabinet') }}">← Вернуться в кабинет</a>
            </p>
        </form>
    </div>
</div>
{% endblock %}
