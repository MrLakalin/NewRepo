{% extends "base.html" %}
{% block title %}Вход в систему{% endblock %}

{% block content %}
<div class="container section flex-center">
    <div class="auth-container">
        <form method="POST" action="{{ url_for('login') }}"
              class="auth-form active" novalidate>
            <h2>Авторизация</h2>

            <div class="form-group">
                <label for="phone">
                    Номер телефона <span class="required">*</span>
                </label>
                <input type="tel" id="phone" name="phone"
                       class="form-input" required autofocus
                       placeholder="+7 (999) 123-45-67">
            </div>

            <div class="form-group">
                <label for="password">
                    Пароль <span class="required">*</span>
                </label>
                <input type="password" id="password" name="password"
                       class="form-input" required placeholder="******">
            </div>

            <button type="submit" class="btn" style="width:100%;">
                Войти
            </button>

            <p class="auth-switch">
                Нет учётной записи?
                <a href="{{ url_for('register') }}">Зарегистрироваться</a>
            </p>
        </form>
    </div>
</div>
{% endblock %}
