{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="container section flex-center">
    <div class="auth-container">
        <form method="POST" action="{{ url_for('register') }}"
              class="auth-form active" novalidate>
            <h2>Регистрация</h2>

            <div class="form-group">
                <label for="phone">
                    Номер телефона <span class="required">*</span>
                </label>
                <input type="tel" id="phone" name="phone"
                       class="form-input" required
                       placeholder="+7 (999) 123-45-67"
                       value="{{ form_data.get('phone', '') }}">
                <small class="form-hint">
                    10–15 цифр. Можно с «+» и без.
                </small>
            </div>

            <div class="form-group">
                <label for="password">
                    Пароль <span class="required">*</span>
                </label>
                <input type="password" id="password" name="password"
                       class="form-input" required minlength="6"
                       placeholder="Минимум 6 символов">
            </div>

            <div class="form-group">
                <label for="confirm_password">
                    Повторный пароль <span class="required">*</span>
                </label>
                <input type="password" id="confirm_password"
                       name="confirm_password" class="form-input"
                       required minlength="6">
            </div>

            <button type="submit" class="btn" style="width:100%;">
                Зарегистрироваться
            </button>

            <p class="auth-switch">
                Уже есть учётная запись?
                <a href="{{ url_for('login') }}">Войти</a>
            </p>
        </form>
    </div>
</div>
{% endblock %}
