{% extends "base.html" %}
{% block title %}Смена пароля{% endblock %}

{% block content %}
<div class="container section flex-center">
    <div class="auth-container">
        <form method="POST" action="{{ url_for('change_password') }}"
              class="auth-form active" novalidate>
            <h2>Смена пароля</h2>
            <p style="margin-bottom:20px;color:#7f8c8d;">
                При первом входе или после сброса пароля администратором
                необходимо задать новый пароль.
            </p>

            <div class="form-group">
                <label for="current_password">
                    Текущий пароль <span class="required">*</span>
                </label>
                <input type="password" id="current_password"
                       name="current_password" class="form-input" required>
            </div>

            <div class="form-group">
                <label for="new_password">
                    Новый пароль <span class="required">*</span>
                </label>
                <input type="password" id="new_password" name="new_password"
                       class="form-input" required minlength="6">
            </div>

            <div class="form-group">
                <label for="confirm_password">
                    Подтверждение нового пароля <span class="required">*</span>
                </label>
                <input type="password" id="confirm_password"
                       name="confirm_password" class="form-input"
                       required minlength="6">
            </div>

            <button type="submit" class="btn" style="width:100%;">
                Изменить пароль
            </button>
        </form>
    </div>
</div>
{% endblock %}
